<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        SkillGraph
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

<header class="navbar">

    <div class="logo">
        SkillGraph
    </div>

    <nav>

        <a href="/">Dashboard</a>

        <a href="/candidates">
            Candidates
        </a>
        <a href="/graph">Graph Explorer</a>

    </nav>

</header>


<main class="container">

    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}

    {% block content %}
    {% endblock %}

</main>


<footer>

    <p>
        SkillGraph · Powered by CognoDB
    </p>

</footer>

</body>

</html>
